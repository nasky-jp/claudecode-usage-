# Market Flow 常駐自動実行 (GitHub Actions)
#
# - スケジュール実行はデフォルトブランチ上のこのファイルが起点になる
# - コード本体は CODE_REF ブランチを checkout して実行する
# - レポートは market-data ブランチに蓄積される (コードとデータを分離)
# - ANTHROPIC_API_KEY は Settings > Secrets and variables > Actions に登録する。
#   未登録でも分析系ジョブが「スキップ」記録になるだけで、答え合わせ等は動く。
# - 注意: パブリックリポジトリでは market-data ブランチの分析レポートも公開される

name: Market Flow

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 夜間分析 平日22:00 JST
    - cron: '0 23 * * 0-4'   # 朝の確認 平日08:00 JST
    - cron: '30 7 * * 1-5'   # 答え合わせ 平日16:30 JST
    - cron: '0 1 * * 6'      # 週次レビュー 土10:00 JST
  workflow_dispatch:
    inputs:
      job:
        description: '実行するジョブ'
        type: choice
        options: [night, morning, scorecard, weekly, screener-test]
        default: scorecard

permissions:
  contents: write

concurrency:
  group: market-flow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick job from schedule
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '0 13 * * 1-5') JOB=night ;;
            '0 23 * * 0-4') JOB=morning ;;
            '30 7 * * 1-5') JOB=scorecard ;;
            '0 1 * * 6')    JOB=weekly ;;
            *)              JOB='${{ inputs.job }}' ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Selected job: $JOB"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/workflow-automation-strategy-kcjke5

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET_FLOW_REPORTS_DIR: ${{ github.workspace }}/data/reports
          MARKET_FLOW_JOURNAL_DIR: ${{ github.workspace }}/data/journal
        run: |
          JOB='${{ steps.pick.outputs.job }}'
          if [ "$JOB" = "screener-test" ]; then
            python -m market_flow.screener --sectors 半導体
          else
            python scripts/run_job.py "$JOB"
          fi

      - name: Commit reports to data branch
        if: always()
        run: |
          cd data
          git config user.name "market-flow-bot"
          git config user.email "market-flow-bot@users.noreply.github.com"
          git add -A
          git commit -m "reports: ${{ steps.pick.outputs.job }} $(date -u '+%Y-%m-%dT%H:%MZ')" || echo "no changes to commit"
          git push origin HEAD:market-data
